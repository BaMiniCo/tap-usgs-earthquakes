[project]
name = "tap-usgs-earthquakes"
version = "0.1.0"
description = "Singer tap for the USGS Earthquake Catalog API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "singer-sdk>=0.40.0",
  "requests>=2.31.0",
]

[project.scripts]
tap-usgs-earthquakes = "tap_usgs_earthquakes:TapUsgsEarthquakes.cli"

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "requests-mock>=1.12.1",
  "ruff>=0.6.0",
  "types-requests>=2.32.0.20240712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tap_usgs_earthquakes"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["live: tests that access the live USGS API"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
